services:
  tonarium:
    build: .
    restart: unless-stopped
    environment:
      # Coolify がドメインを割り当てて 3001 番へ転送する
      - SERVICE_FQDN_TONARIUM_3001
      # ブラウザが直接つなぐ LiveKit の URL（下の livekit サービスに割り当てたドメイン）
      - LIVEKIT_URL=wss://${LIVEKIT_DOMAIN}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - KOKOSYNC_URL=${KOKOSYNC_URL:-https://45.77.130.146}
      - KOKOSYNC_USERNAME=${KOKOSYNC_USERNAME}
      - KOKOSYNC_PASSWORD=${KOKOSYNC_PASSWORD}
      - SERVER_PORT=3001
      # パスワードは URL にそのまま入れるので、記号を含まないもの（例: openssl rand -hex 24）にする
      - DATABASE_URL=postgres://tonarium:${POSTGRES_PASSWORD}@postgres:5432/tonarium
      # 画像の置き場（Cloudflare R2）。docs/deploy.md を参照。
      # 既定値は compose の ${:-} ではなくアプリ側で決める（Coolify では既定値付きの変数が空のまま渡ることがあったため）
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - S3_PREFIX=${S3_PREFIX}
      # ログインに使う Misskey。空なら https://misskey.resonite.love
      - MISSKEY_URL=${MISSKEY_URL}
      # - SESSIONS_FILE=/config/sessions.json
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    volumes:
      - tonarium-data:/app/data
    #   - ./sessions.json:/config/sessions.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      - POSTGRES_USER=tonarium
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=tonarium
    volumes:
      - tonarium-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tonarium"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 1 日 1 回、DB を丸ごと R2 へ送る。古いバックアップの削除は R2 のライフサイクルルールで行う（docs/deploy.md）
  db-backup:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGUSER=tonarium
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=tonarium
      # 画像と同じ R2 の認証情報で、別のバケット（公開しない）へ送る
      - BACKUP_S3_ENDPOINT=${S3_ENDPOINT}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=auto
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # 入れられなければ終わり、restart で入れ直す（入らないまま失敗を繰り返さない）
        apk add --no-cache aws-cli > /dev/null || exit 1
        if [ -z "$$BACKUP_S3_BUCKET" ]; then echo "BACKUP_S3_BUCKET が未設定のため DB のバックアップは止めています"; exec sleep infinity; fi
        while true; do
          f="db/tonarium-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          # パイプでつなぐと pg_dump が途中で失敗しても成功扱いになるので、一度ファイルに書き切ってから送る
          if pg_dump -Fc -f /tmp/backup.dump && aws s3 cp /tmp/backup.dump "s3://$$BACKUP_S3_BUCKET/$$f" --endpoint-url "$$BACKUP_S3_ENDPOINT"; then echo "backup: $$f"; else echo "backup failed: $$f"; fi
          rm -f /tmp/backup.dump
          sleep "$${BACKUP_INTERVAL_SECONDS:-86400}"
        done

  # 自前の LiveKit（通話・画面共有・ライブ）。シグナリング（wss）は Coolify のドメイン経由で 7880 番へ、
  # 音声・映像は下の ports でサーバーに直接届く
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_LIVEKIT_7880
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      - |
        LIVEKIT_CONFIG=
        port: 7880
        rtc:
          tcp_port: ${LIVEKIT_RTC_TCP_PORT:-7881}
          udp_port: ${LIVEKIT_RTC_UDP_PORT:-7882}
          use_external_ip: true
        turn:
          enabled: true
          domain: ${LIVEKIT_DOMAIN}
          udp_port: ${LIVEKIT_TURN_UDP_PORT:-3478}
        logging:
          level: info
    expose:
      - "7880"
    # 公開ポートは LIVEKIT_CONFIG 側の案内ポートと必ず一致させること（クライアントは設定側の番号へ接続する）。
    # 同じサーバーに複数インスタンスを立てるときは環境変数でインスタンスごとにずらす
    ports:
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:${LIVEKIT_RTC_TCP_PORT:-7881}/tcp"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:${LIVEKIT_RTC_UDP_PORT:-7882}/udp"
      - "${LIVEKIT_TURN_UDP_PORT:-3478}:${LIVEKIT_TURN_UDP_PORT:-3478}/udp"

volumes:
  tonarium-data:
  tonarium-db:
