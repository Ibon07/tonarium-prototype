services:
  tonarium:
    build: .
    restart: unless-stopped
    environment:
      # Coolify がドメインを割り当てて 3001 番へ転送する
      - SERVICE_FQDN_TONARIUM_3001
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - SERVER_PORT=3001
      # - CHANNELS_FILE=/config/channels.json
    expose:
      - "3001"
    # volumes:
    #   - ./channels.json:/config/channels.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
