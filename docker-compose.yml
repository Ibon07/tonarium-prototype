services:
  tonarium:
    build: .
    restart: unless-stopped
    environment:
      # Coolify がドメインを割り当てて 3001 番へ転送する
      - SERVICE_FQDN_TONARIUM_3001
      # ブラウザが直接つなぐ LiveKit の URL（下の livekit サービスに割り当てたドメイン）
      - LIVEKIT_URL=wss://${LIVEKIT_DOMAIN}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - KOKOSYNC_URL=${KOKOSYNC_URL:-https://45.77.130.146}
      - KOKOSYNC_USERNAME=${KOKOSYNC_USERNAME}
      - KOKOSYNC_PASSWORD=${KOKOSYNC_PASSWORD}
      - SERVER_PORT=3001
      # HTTPS 終端プロキシの実アドレスだけを信頼する。未設定では転送ヘッダーを信頼しない。
      - FANTASY_TRUST_PROXY=${FANTASY_TRUST_PROXY:-0}
      - FANTASY_TRUSTED_PROXY_IPS=${FANTASY_TRUSTED_PROXY_IPS:-}
      - KOKOAAI_BASEURL=${KOKOAAI_BASEURL:-https://chat.kokoa.dev/v1}
      - KOKOAAI_MODEL=${KOKOAAI_MODEL:-lfm3-1.7b}
      - KOKOAAI_APIKEY=${KOKOAAI_APIKEY:-}
      # - SESSIONS_FILE=/config/sessions.json
    expose:
      - "3001"
    volumes:
      - tonarium-data:/app/data
    #   - ./sessions.json:/config/sessions.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # 自前の LiveKit（通話・画面共有・ライブ）。シグナリング（wss）は Coolify のドメイン経由で 7880 番へ、
  # 音声・映像は下の ports でサーバーに直接届く
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_LIVEKIT_7880
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      - |
        LIVEKIT_CONFIG=
        port: 7880
        rtc:
          tcp_port: ${LIVEKIT_RTC_TCP_PORT:-7881}
          udp_port: ${LIVEKIT_RTC_UDP_PORT:-7882}
          use_external_ip: true
        turn:
          enabled: true
          domain: ${LIVEKIT_DOMAIN}
          udp_port: ${LIVEKIT_TURN_UDP_PORT:-3478}
        logging:
          level: info
    expose:
      - "7880"
    # 公開ポートは LIVEKIT_CONFIG 側の案内ポートと必ず一致させること（クライアントは設定側の番号へ接続する）。
    # 同じサーバーに複数インスタンスを立てるときは環境変数でインスタンスごとにずらす
    ports:
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:${LIVEKIT_RTC_TCP_PORT:-7881}/tcp"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:${LIVEKIT_RTC_UDP_PORT:-7882}/udp"
      - "${LIVEKIT_TURN_UDP_PORT:-3478}:${LIVEKIT_TURN_UDP_PORT:-3478}/udp"

volumes:
  tonarium-data:
