name: Web checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHANGELOG_BASE: ${{ github.event.pull_request.base.sha || format('{0}^', github.sha) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Require a new changelog entry
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/check-changelog.mjs
      - run: npm ci
      - run: npm run test:changelog
      - run: npm run check:shared-systems-docs
      - run: npm run test:shared-systems-docs
      - run: npm run check:completion
      - run: npm run test:client
      - run: npm run test:sync
      - run: npm run test:timeline
      - run: npm run test:shared-assets
      - run: npm run test:systems
      - run: npm run test:systems-playtest
      - run: npm run test:content-translations
