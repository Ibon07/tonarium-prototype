name: Electron nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electron:
    name: Electron (${{ matrix.runtime }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: nightly-electron-${{ matrix.runtime }}
      cancel-in-progress: false
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            platform: linux
            os: ubuntu-24.04
          - runtime: win-x64
            platform: win
            os: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci --prefix electron
      - run: npm run electron:test
      - name: Build Electron with nightly update metadata
        run: node electron/scripts/build.cjs --${{ matrix.platform }} --nightly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-electron-${{ matrix.runtime }}
          path: electron/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Install metadata validation dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Publish this Electron nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python .github/scripts/publish-nightly.py electron "${{ matrix.runtime }}" electron/artifacts
