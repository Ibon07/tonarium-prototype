name: Native checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Build native UI checks
        run: dotnet build native/Tonarium.UiSmoke -c Release
      - name: Verify native layouts and chat scrolling
        shell: pwsh
        run: |
          dotnet run --project native/Tonarium.UiSmoke -c Release --no-build -- unused native/artifacts/ci-panels --side-panels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project native/Tonarium.UiSmoke -c Release --no-build -- unused native/artifacts/ci-chat --chat-scroll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify self-contained Windows publish
        shell: pwsh
        run: ./native/publish-desktop.ps1 -SkipUnity
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-ui-checks
          path: native/artifacts/ci-*
          if-no-files-found: ignore
          retention-days: 14
