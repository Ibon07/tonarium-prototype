name: Native checks

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'packaging/**'
      - 'client/public/brand/**'
      - 'client/public/oekaki/sample.png'
      - '.github/workflows/native-checks.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'packaging/**'
      - 'client/public/brand/**'
      - 'client/public/oekaki/sample.png'
      - '.github/workflows/native-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Build native UI checks
        run: dotnet build native/Tonarium.UiSmoke -c Release
      - name: Verify native layouts and chat scrolling
        shell: pwsh
        run: |
          dotnet run --project native/Tonarium.UiSmoke -c Release --no-build -- unused native/artifacts/ci-panels --side-panels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project native/Tonarium.UiSmoke -c Release --no-build -- unused native/artifacts/ci-chat --chat-scroll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify self-contained Windows publish
        shell: pwsh
        run: ./native/publish-desktop.ps1 -SkipUnity
      - name: Verify Windows apphost manifest
        run: |
          python -m pip install pefile==2024.8.26
          python native/verify-windows-manifest.py native/artifacts/Tonarium-win-x64/Tonarium.exe
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-ui-checks
          path: native/artifacts/ci-*
          if-no-files-found: ignore
          retention-days: 14

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libfontconfig1 libice6 libsm6 libxrandr2
      - run: dotnet build native/Tonarium.UiSmoke -c Release
      - name: Verify layouts and scrolling
        run: |
          dotnet run --project native/Tonarium.UiSmoke -c Release --no-build -- unused native/artifacts/ci-linux-panels --side-panels
          dotnet run --project native/Tonarium.UiSmoke -c Release --no-build -- unused native/artifacts/ci-linux-chat --chat-scroll
      - name: Verify Linux publish and X11 startup
        run: |
          dotnet publish native/Tonarium.Desktop -c Release -r linux-x64 --self-contained true -o native/artifacts/ci-linux-publish
          timeout 30s xvfb-run -a native/artifacts/ci-linux-publish/Tonarium --demo --data-dir /tmp/tonarium-ci --screenshot native/artifacts/ci-linux-demo
          test -s native/artifacts/ci-linux-demo/home.png
          test -s native/artifacts/ci-linux-demo/room.png
      - name: Verify Windows cross-publish manifest on Linux
        run: |
          dotnet publish native/Tonarium.UiSmoke -c Release -r win-x64 --self-contained true -o native/artifacts/ci-windows-cross
          python3 -m pip install pefile==2024.8.26
          python3 native/verify-windows-manifest.py native/artifacts/ci-windows-cross/Tonarium.UiSmoke.exe
          python3 native/verify-windows-manifest.py native/artifacts/ci-windows-cross/Tonarium.exe
      - run: python3 -m py_compile native/Tonarium.Desktop/Linux/*.py
      - name: Upload Linux UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-ui-checks
          path: |
            native/artifacts/ci-linux-panels
            native/artifacts/ci-linux-chat
            native/artifacts/ci-linux-demo
          retention-days: 14
