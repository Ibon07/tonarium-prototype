name: Release Windows client

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Validate tag, committed build and checksum
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo 'Run this workflow on a version tag'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Use a tag such as v0.0.1'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release tags must point to a commit on main'; exit 1; }
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          tag = os.environ['RELEASE_TAG']
          folder = pathlib.Path('releases/windows') / tag
          archive = folder / f'Tonarium-{tag}-win-x64.zip'
          expected = archive.with_suffix('.zip.sha256').read_text().split()[0]
          actual = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          assert actual == expected, 'Committed Windows ZIP checksum mismatch'
          metadata = json.loads((folder / 'release.json').read_text(encoding='utf-8-sig'))
          assert metadata['version'] == tag[1:], 'Tag and build version differ'
          subprocess.run(['git', 'merge-base', '--is-ancestor', metadata['commit'], 'HEAD'], check=True)
          with zipfile.ZipFile(archive) as bundle:
              entries = {name.replace('\\', '/'): name for name in bundle.namelist()}
              for required in ('Tonarium.exe', 'Tonarium.dll', 'Unity/Tonarium3D.exe', 'Unity/UnityPlayer.dll', 'Unity/Tonarium3D_Data/globalgamemanagers', 'README.txt', 'release.json'):
                  assert 'Tonarium-win-x64/' + required in entries, f'Missing {required}'
              embedded = json.loads(bundle.read(entries['Tonarium-win-x64/release.json']).decode('utf-8-sig'))
              assert embedded == metadata, 'Build metadata and ZIP differ'
          print(f'Validated {archive.name}: {actual}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tonarium-${{ github.ref_name }}-win-x64
          path: releases/windows/${{ github.ref_name }}/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Attach committed Windows client to Release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            options=(--verify-tag --title "Tonarium $RELEASE_TAG" --generate-notes)
            [[ "$RELEASE_TAG" != *-* ]] || options+=(--prerelease)
            gh release create "$RELEASE_TAG" "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" releases/windows/"$RELEASE_TAG"/* --clobber
