name: Release Windows client

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate release version and source
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Use a tag such as v0.0.1'; exit 1; }
            git merge-base --is-ancestor HEAD origin/main || { echo 'Release tags must point to a commit on main'; exit 1; }
            version="${REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  unity:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Unity Personal credentials
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          for key in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            [[ -n "${!key}" ]] || { echo "::error::Set the $key repository secret. See docs/native-release.md"; exit 1; }
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Sync original Web assets
        run: node native/Tonarium.Unity/Tools/sync-web-assets.cjs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: native/Tonarium.Unity/Library
          key: unity-linux-win64-2022.3.22f1-${{ hashFiles('native/Tonarium.Unity/Assets/**', 'native/Tonarium.Unity/Packages/**', 'native/Tonarium.Unity/ProjectSettings/**') }}
          restore-keys: unity-linux-win64-2022.3.22f1-
      - name: Build Unity Windows player
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: native/Tonarium.Unity
          unityVersion: 2022.3.22f1
          targetPlatform: StandaloneWindows64
          buildMethod: Tonarium.UnityClient.Editor.WindowsBuild.Build
          buildsPath: native/build
          buildName: Tonarium3D
          versioning: Custom
          version: ${{ needs.prepare.outputs.version }}
          allowDirtyBuild: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-win-x64
          path: native/build/StandaloneWindows64/
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained desktop
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./native/publish-desktop.ps1 -SkipUnity -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-win-x64
          path: native/artifacts/Tonarium-win-x64/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package:
    needs: [prepare, unity, desktop]
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-win-x64
          path: native/artifacts/Tonarium-win-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unity-win-x64
          path: native/artifacts/Tonarium-win-x64/Unity
      - name: Package complete Windows client
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./native/package-windows.ps1 -Version $env:RELEASE_VERSION -Commit $env:GITHUB_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tonarium-v${{ needs.prepare.outputs.version }}-win-x64
          path: native/artifacts/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish tag release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem native/artifacts/releases -File | ForEach-Object FullName)
          gh release view $env:RELEASE_TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @files --clobber
          } else {
            $arguments = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--title', "Tonarium $env:RELEASE_TAG", '--generate-notes')
            if ($env:RELEASE_TAG.Contains('-')) { $arguments += '--prerelease' }
            gh @arguments @files
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
