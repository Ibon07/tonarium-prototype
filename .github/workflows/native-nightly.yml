name: Nightly clients

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.runtime }})
    concurrency:
      group: nightly-native-${{ matrix.runtime }}
      cancel-in-progress: false
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            target: StandaloneLinux64
            method: BuildLinux
          - runtime: win-x64
            target: StandaloneWindows64
            method: Build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Unity credentials
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo '::error::Configure UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE (or UNITY_SERIAL). See docs/native-release.md.'
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run typecheck && npm run build
      - run: node native/Tonarium.Unity/Tools/sync-web-assets.cjs
      - name: Build Unity player
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: native/Tonarium.Unity
          unityVersion: auto
          targetPlatform: ${{ matrix.target }}
          buildMethod: Tonarium.UnityClient.Editor.WindowsBuild.${{ matrix.method }}
          buildName: Tonarium3D
          buildsPath: native/build/nightly-unity
          versioning: None
      - name: Prepare Unity output for packaging
        env:
          UNITY_TARGET: ${{ matrix.target }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          # GameCI runs as root; restore the parent too so dotnet can create nightly/.
          sudo chown -R "$(id -u):$(id -g)" native/build
          # GameCI supplies an extensionless customBuildPath on Linux.
          # Keep the executable name expected by the launcher and packager.
          if [[ "$RUNTIME" == linux-x64 ]]; then
            player="native/build/nightly-unity/$UNITY_TARGET/Tonarium3D"
            if [[ ! -f "$player.x86_64" && -f "$player" ]]; then
              mv "$player" "$player.x86_64"
            fi
            test -x "$player.x86_64"
          fi
      - name: Publish .NET client
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          dotnet publish native/Tonarium.Desktop -c Release -r "$RUNTIME" --self-contained true \
            -p:Version="0.0.0-nightly.$GITHUB_RUN_NUMBER" -p:DebugType=None -p:DebugSymbols=false \
            -o "native/build/nightly/$RUNTIME"
      - name: Verify Windows apphost manifest
        if: matrix.runtime == 'win-x64'
        run: |
          python3 -m pip install pefile==2024.8.26
          python3 native/verify-windows-manifest.py native/build/nightly/win-x64/Tonarium.exe
      - name: Package native client and Unity
        env:
          RUNTIME: ${{ matrix.runtime }}
          UNITY_TARGET: ${{ matrix.target }}
        run: python3 native/package-nightly.py "$RUNTIME" "native/build/nightly/$RUNTIME" "native/build/nightly-unity/$UNITY_TARGET" native/artifacts/nightly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-${{ matrix.runtime }}
          path: native/artifacts/nightly/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish this native nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish-nightly.py native "${{ matrix.runtime }}" native/artifacts/nightly

  electron:
    name: Electron (${{ matrix.runtime }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: nightly-electron-${{ matrix.runtime }}
      cancel-in-progress: false
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            platform: linux
            os: ubuntu-24.04
          - runtime: win-x64
            platform: win
            os: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci --prefix electron
      - run: npm run electron:test
      - name: Build Electron with nightly update metadata
        run: node electron/scripts/build.cjs --${{ matrix.platform }} --nightly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-electron-${{ matrix.runtime }}
          path: electron/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Install metadata validation dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Publish this Electron nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python .github/scripts/publish-nightly.py electron "${{ matrix.runtime }}" electron/artifacts
