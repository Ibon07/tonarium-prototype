# 手元の開発用 LiveKit（npm run livekit で起動）。キーは devkey / secret 固定
services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    # コンテナ内の IP はブラウザから届かないので、候補として 127.0.0.1 を案内させる
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
