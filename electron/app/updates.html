<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>Tonarium Electron — 更新</title><link rel="stylesheet" href="local.css"><link rel="stylesheet" href="updates.css"></head>
<body><main><h1>アプリの更新</h1>
<p>GitHub Releases の最新の Electron nightly を確認します。Web画面はサーバー側の更新が反映されます。</p>
<p id="first" hidden>起動時の更新確認を有効にしますか？ 設定はこの画面でいつでも変更できます。</p>
<form id="updates">
<label class="toggle"><input id="check-on-startup" type="checkbox">起動時に更新を確認する</label>
<label class="toggle nested"><input id="auto-install" type="checkbox">更新を自動でダウンロードし、アプリ終了時に適用する</label>
<p class="hint">自動更新をオフにすると、更新の有無だけを表示します。通話や作業中に自動で再起動することはありません。</p>
<div class="actions"><button id="save" type="submit">設定を保存</button><button id="check" type="button">今すぐ確認</button></div>
</form>
<p id="version" class="hint"></p><p id="status" role="status" aria-live="polite"></p><p id="error" role="alert"></p>
<div class="actions"><button id="install" type="button" hidden>再起動して更新</button><button id="release" type="button">Releasesを開く</button></div>
</main><script src="updates.js"></script></body></html>
