<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tonarium（プロトタイプ）</title>
    <meta name="description" content="2D と 3D を行き来しながら、同じ場所で話したり遊んだりできるソーシャル体験のプロトタイプ" />
    <meta name="theme-color" content="#EAE5DB" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Tonarium" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- __VERSION__ はサーバーが画面の版に置き換える。つなぎ直したときに版が変わっていたら更新を促す -->
    <meta name="tonarium-version" content="__VERSION__" />
    <!-- __ORIGIN__ はサーバーがアクセスされたドメインに置き換える（OGP の画像は絶対 URL でないと読まれない） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tonarium" />
    <meta property="og:title" content="Tonarium（プロトタイプ）" />
    <meta property="og:description" content="2D と 3D を行き来しながら、同じ場所で話したり遊んだりできるソーシャル体験のプロトタイプ" />
    <meta property="og:url" content="__ORIGIN__/" />
    <meta property="og:image" content="__ORIGIN__/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tonarium のロゴ" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Misskey の OAuth はこのページ（client_id）を読みに来て、戻り先とアプリの名前・アイコンを確かめる -->
    <link rel="redirect_uri" href="__ORIGIN__/auth/misskey/callback" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="h-app" hidden><img class="u-logo" src="__ORIGIN__/brand/mark.png" alt="" /><a class="u-url p-name" href="__ORIGIN__/">Tonarium</a></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
